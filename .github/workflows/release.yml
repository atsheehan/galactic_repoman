name: Release (SteamPipe)

# PRIMARY publish path. Runs automatically on every push to main, and on manual
# dispatch when you need to target a different beta branch or upload without
# promoting. No third-party action ever receives the Steam credentials —
# checkout/rust/artifact actions never see them; the secret only touches our own
# run: steps and Valve's steamcmd binary.
#
# Nothing is built or published until `ci` passes. It calls .github/workflows/ci.yml
# as a reusable workflow rather than duplicating fmt/clippy/test here, so the
# checks stay defined in one place; the local `uses: ./...` form runs them at this
# run's own commit, so what gets tested is exactly what gets published.
#
# The rest is split into two jobs so a publish failure (bad credentials,
# Steam/network hiccup) can be retried via "Re-run failed jobs" WITHOUT repeating
# the ~15-minute build: `build` stages the content and uploads it as an artifact;
# `publish` downloads it and uploads to Steam. Re-running only the failed
# `publish` job reuses the artifact from the original `build` job in the same run.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: "Steam beta branch to auto-promote to (NEVER default/public)"
        required: true
        default: "internal"
      set_live:
        description: "Set the build live on that branch (uncheck to upload without promoting)"
        type: boolean
        required: true
        default: true
      description:
        description: "Build description shown on the Steamworks Builds page"
        required: true
        default: "CI triangle scaffold build"

permissions:
  contents: read

concurrency:
  group: steam-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and stage content
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.1

      - name: Build, stage content, and render VDFs
        env:
          APPID: ${{ vars.STEAM_APP_ID }}
          DEPOTID: ${{ vars.STEAM_DEPOT_ID }}
          # On push there is no inputs context, so pin the dispatch defaults
          # explicitly — otherwise the expression collapses to '' and every merge
          # would upload without promoting.
          # Empty setlive uploads the build without promoting it — used to
          # isolate a setlive/branch problem from an account-permission one.
          SETLIVE: ${{ github.event_name == 'push' && 'internal' || (inputs.set_live && inputs.branch || '') }}
        run: ./scripts/package.sh

      # Tar preserves the executable bit (Steam's Linux depot tracks +x);
      # upload-artifact alone would drop it.
      - name: Archive staged content
        run: tar -czf steampipe-build.tar.gz -C ci/steampipe build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: steampipe-build
          path: steampipe-build.tar.gz
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish to SteamPipe
    needs: build
    runs-on: ubuntu-latest
    environment: Deploy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: steampipe-build

      - name: Unpack staged content
        run: tar -xzf steampipe-build.tar.gz -C ci/steampipe

      - name: Install steamcmd 32-bit runtime dependency
        run: sudo apt-get update && sudo apt-get install -y lib32gcc-s1

      - name: Bootstrap steamcmd from Valve CDN
        run: ./scripts/bootstrap_steamcmd.sh

      - name: Generate Steam Guard code and publish
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
          STEAM_SHARED_SECRET: ${{ secrets.STEAM_SHARED_SECRET }}
          APPID: ${{ vars.STEAM_APP_ID }}
        run: |
          CODE="$(python3 scripts/steam_guard_totp.py)"
          echo "::add-mask::$CODE"
          tools/steamcmd/steamcmd.sh \
            +set_steam_guard_code "$CODE" \
            +login "$STEAM_USERNAME" "$STEAM_PASSWORD" \
            +run_app_build "$PWD/ci/steampipe/build/app_build_${APPID}.vdf" \
            +quit

      # steamcmd's "Failed to commit build ... : Failure" is a generic message;
      # the real reason (branch not found, access denied, depot not associated)
      # is in its own logs. Surface them so failures are diagnosable.
      - name: Dump steamcmd logs on failure
        if: failure()
        run: |
          for f in "$HOME"/Steam/logs/*.txt; do
            [ -e "$f" ] || continue
            echo "===== $f ====="
            cat "$f"
          done
